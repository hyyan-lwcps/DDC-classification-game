<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>圖書分類大挑戰 - 小一小二自主學習版</title>
  <style>
    /* 全局樣式與 RWD 設定 */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "Microsoft JhengHei", "微軟正黑體", Arial, sans-serif;
    }

    body {
      background-color: #f0f8ff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 15px;
    }

    .game-container {
      background-color: #ffffff;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.15);
      width: 100%;
      max-width: 650px;
      padding: 25px;
      text-align: center;
      position: relative;
      border: 4px solid #4a90e2;
    }

    h1 {
      color: #2c3e50;
      font-size: 1.8rem;
      margin-bottom: 10px;
    }

    .sub-title {
      color: #7f8c8d;
      font-size: 1.1rem;
      margin-bottom: 25px;
    }

    /* 階段 1：首頁等級選擇界面 */
    #start-screen {
      display: flex;
      flex-direction: column;
      gap: 15px;
      margin: 20px 0;
    }

    .level-card {
      background: #f8f9fa;
      border: 3px solid #e0e0e0;
      border-radius: 15px;
      padding: 20px;
      cursor: pointer;
      transition: all 0.2s ease;
      text-align: left;
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .level-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 6px 12px rgba(0,0,0,0.1);
    }

    .level-card.p1 { border-color: #2ecc71; }
    .level-card.p1:hover { background-color: #e8f8f5; }

    .level-card.p2 { border-color: #3498db; }
    .level-card.p2:hover { background-color: #ebf5fb; }

    .level-icon {
      font-size: 2.5rem;
    }

    .level-info h3 {
      font-size: 1.3rem;
      color: #2c3e50;
      margin-bottom: 5px;
    }

    .level-info p {
      font-size: 0.95rem;
      color: #7f8c8d;
    }

    /* 階段 2：遊戲界面 (預設隱藏) */
    #game-screen {
      display: none;
    }

    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }

    .btn-back {
      background: #e74c3c;
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }

    .status-bar {
      display: flex;
      justify-content: space-between;
      font-size: 1.1rem;
      font-weight: bold;
      color: #34495e;
      margin-bottom: 15px;
      background-color: #ebf5fb;
      padding: 10px 15px;
      border-radius: 12px;
    }

    /* 卡片區塊 */
    .book-card {
      background: #fff8dc;
      border: 3px dashed #f39c12;
      border-radius: 15px;
      padding: 25px 15px;
      margin-bottom: 20px;
      min-height: 140px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .book-title {
      font-size: 1.7rem;
      font-weight: bold;
      color: #d35400;
      margin-top: 8px;
      word-break: break-all;
    }

    /* 動態選項群組 */
    .options-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 12px;
      margin-bottom: 15px;
    }

    .btn-option {
      padding: 15px 10px;
      font-size: 1.1rem;
      font-weight: bold;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      background-color: #3498db;
      color: white;
      transition: transform 0.1s, background-color 0.2s;
      box-shadow: 0 4px 0 rgba(0,0,0,0.15);
    }

    .btn-option:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 rgba(0,0,0,0.15);
    }

    .btn-restart {
      background-color: #e67e22;
      color: white;
      margin-top: 15px;
      padding: 12px 25px;
      font-size: 1.1rem;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      font-weight: bold;
      margin-right: 5px;
    }

    /* 回饋與教學提示 */
    .feedback {
      min-height: 48px;
      font-size: 1.2rem;
      font-weight: bold;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }
    .correct { color: #27ae60; }
    .wrong { color: #c0392b; }
    .tip-text {
      font-size: 0.95rem;
      color: #7f8c8d;
      margin-top: 4px;
      font-weight: normal;
    }

    /* 結果彈窗 Modal */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0,0,0,0.6);
      justify-content: center;
      align-items: center;
      z-index: 100;
    }

    .modal-content {
      background-color: #ffffff;
      background-image: url('happy.png'); 
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      border-radius: 20px;
      padding: 25px;
      width: 90%;
      max-width: 450px;
      text-align: center;
      box-shadow: 0 5px 15px rgba(0,0,0,0.3);
      border: 5px solid #f1c40f;
    }

    .modal-overlay {
      background-color: rgba(255, 255, 255, 0.88);
      padding: 20px;
      border-radius: 15px;
    }

    .modal-title {
      font-size: 1.8rem;
      color: #2c3e50;
      margin-bottom: 10px;
    }

    .score-display {
      font-size: 1.6rem;
      color: #e74c3c;
      font-weight: bold;
      margin: 15px 0;
    }

    @media (max-width: 480px) {
      .options-grid { grid-template-columns: 1fr; }
      .book-title { font-size: 1.4rem; }
      .level-card { padding: 15px; }
    }
  </style>
</head>
<body>

  <div class="game-container">
    
    <!-- 階段 1：選擇等級首頁 -->
    <div id="start-screen">
      <h1>📚 圖書分類大挑戰</h1>
      <p class="sub-title">請選擇你的年級開始遊戲：</p>

      <div class="level-card p1" onclick="selectLevel('P1')">
        <div class="level-icon">🌱</div>
        <div class="level-info">
          <h3>小一初級挑戰</h3>
          <p>分類：知識類圖書 vs 故事類圖書</p>
        </div>
      </div>

      <div class="level-card p2" onclick="selectLevel('P2')">
        <div class="level-icon">🚀</div>
        <div class="level-info">
          <h3>小二高級挑戰</h3>
          <p>分類：杜威十進分類法（十類圖書大挑戰）</p>
        </div>
      </div>
    </div>

    <!-- 階段 2：遊戲進行界面 -->
    <div id="game-screen">
      <div class="header-bar">
        <span id="level-badge" style="font-weight: bold; color: #34495e;"></span>
        <button class="btn-back" onclick="showStartScreen()">🏠 返回主頁</button>
      </div>
      
      <div class="status-bar">
        <span>第 <span id="current-question">1</span> / 10 題</span>
        <span>得分：<span id="score">0</span> 分</span>
      </div>

      <div class="book-card">
        <div>📖 請為這本書分類：</div>
        <div class="book-title" id="book-title">載入中...</div>
      </div>

      <!-- 動態按鈕 -->
      <div class="options-grid" id="options-container"></div>

      <!-- 答題反饋 -->
      <div class="feedback" id="feedback"></div>
    </div>

  </div>

  <!-- 每局結算彈窗 Modal -->
  <div class="modal" id="result-modal">
    <div class="modal-content">
      <div class="modal-overlay">
        <div class="modal-title">🎉 挑戰完成！</div>
        <div class="score-display">你一共得到 <span id="final-score">0</span> / 10 分！</div>
        <p id="eval-text" style="font-size: 1.1rem; font-weight: bold; color: #34495e;"></p>
        <div style="margin-top: 15px;">
          <button class="btn-restart" onclick="restartGame()">再玩一次 🔄</button>
          <button class="btn-restart" style="background-color: #3498db;" onclick="showStartScreen()">選其他等級 🏠</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    // 小一題庫 (知識類 vs 故事類)
    const p1Questions = [
      { title: "《恐龍大百科》", answer: "knowledge" },
      { title: "《白雪公主》", answer: "story" },
      { title: "《神奇的植物世界》", answer: "knowledge" },
      { title: "《三隻小豬》", answer: "story" },
      { title: "《香港野生動物圖鑑》", answer: "knowledge" },
      { title: "《小紅帽》", answer: "story" },
      { title: "《認識我們的體內器官》", answer: "knowledge" },
      { title: "《伊索寓言故事》", answer: "story" },
      { title: "《宇宙與九大行星》", answer: "knowledge" },
      { title: "《醜小鴨歷險記》", answer: "story" },
      { title: "《交通工具演變史》", answer: "knowledge" },
      { title: "《睡美人》", answer: "story" }
    ];

    const p1Options = [
      { label: "💡 知識類圖書", value: "knowledge", color: "#2ecc71" },
      { label: "📖 故事類圖書", value: "story", color: "#e74c3c" }
    ];

    // 小二題庫 (杜威十進分類法)
    const deweyCategories = {
      "100": "100 哲學類",
      "300": "300 社會科學",
      "500": "500 自然科學",
      "600": "600 應用科學",
      "700": "700 藝術與休閒",
      "800": "800 文學類"
    };

    const p2Questions = [
      { title: "《香港小學生活與法律知識》", answer: "300" },
      { title: "《世界各國傳統節日習俗》", answer: "300" },
      { title: "《有趣的昆蟲圖鑑》", answer: "500" },
      { title: "《太陽系與神秘黑洞》", answer: "500" },
      { title: "《神奇的機器人與AI技術》", answer: "600" },
      { title: "《從小學會身體保健與飲食》", answer: "600" },
      { title: "《兒童摺紙與手工藝大全》", answer: "700" },
      { title: "《世界名畫繪畫入門》", answer: "700" },
      { title: "《安徒生童話全集》", answer: "800" },
      { title: "《成語故事與小學詩詞》", answer: "800" },
      { title: "《認識自己與學習思考》", answer: "100" },
      { title: "《汽車與高鐵是如何運作的》", answer: "600" }
    ];

    const p2Options = [
      { label: "100 哲學類", value: "100", color: "#9b59b6" },
      { label: "300 社會科學", value: "300", color: "#3498db" },
      { label: "500 自然科學", value: "500", color: "#2ecc71" },
      { label: "600 應用科學", value: "600", color: "#e67e22" },
      { label: "700 藝術與休閒", value: "700", color: "#1abc9c" },
      { label: "800 文學類", value: "800", color: "#e74c3c" }
    ];

    let currentLevel = 'P1';
    let currentQuestions = [];
    let currentIndex = 0;
    let score = 0;
    let canAnswer = true;

    // Web Audio API 音效
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playSound(isCorrect) {
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);

      if (isCorrect) {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(523.25, audioCtx.currentTime); 
        osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.1); 
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
        osc.start(audioCtx.currentTime);
        osc.stop(audioCtx.currentTime + 0.3);
      } else {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(150, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
        osc.start(audioCtx.currentTime);
        osc.stop(audioCtx.currentTime + 0.3);
      }
    }

    // 回到首頁選擇等級
    function showStartScreen() {
      document.getElementById('result-modal').style.display = 'none';
      document.getElementById('game-screen').style.display = 'none';
      document.getElementById('start-screen').style.display = 'flex';
    }

    // 選擇等級並開始遊戲
    function selectLevel(level) {
      currentLevel = level;
      document.getElementById('start-screen').style.display = 'none';
      document.getElementById('game-screen').style.display = 'block';

      document.getElementById('level-badge').innerText = level === 'P1' ? '🌱 小一初級' : '🚀 小二高級';
      initGame();
    }

    // 初始化題目
    function initGame() {
      const bank = currentLevel === 'P1' ? p1Questions : p2Questions;
      let shuffled = [...bank].sort(() => 0.5 - Math.random());
      currentQuestions = shuffled.slice(0, 10);

      currentIndex = 0;
      score = 0;
      canAnswer = true;

      document.getElementById('score').innerText = score;
      document.getElementById('result-modal').style.display = 'none';
      document.getElementById('feedback').innerHTML = '';

      renderOptionButtons();
      showQuestion();
    }

    function renderOptionButtons() {
      const container = document.getElementById('options-container');
      container.innerHTML = '';
      const options = currentLevel === 'P1' ? p1Options : p2Options;

      options.forEach(opt => {
        const btn = document.createElement('button');
        btn.className = 'btn-option';
        btn.style.backgroundColor = opt.color;
        btn.innerText = opt.label;
        btn.onclick = () => checkAnswer(opt.value);
        container.appendChild(btn);
      });
    }

    function showQuestion() {
      document.getElementById('current-question').innerText = currentIndex + 1;
      document.getElementById('book-title').innerText = currentQuestions[currentIndex].title;
      document.getElementById('feedback').innerHTML = '';
      canAnswer = true;
    }

    function checkAnswer(selectedVal) {
      if (!canAnswer) return;
      canAnswer = false;

      const currentQ = currentQuestions[currentIndex];
      const feedbackEl = document.getElementById('feedback');

      if (selectedVal === currentQ.answer) {
        score++;
        document.getElementById('score').innerText = score;
        feedbackEl.className = "feedback correct";
        feedbackEl.innerHTML = "答對了！太棒了！👏";
        playSound(true);
      } else {
        feedbackEl.className = "feedback wrong";
        if (currentLevel === 'P2') {
          const correctCatName = deweyCategories[currentQ.answer];
          feedbackEl.innerHTML = `答錯了！<div class="tip-text">💡 提示：《${currentQ.title}》屬於 <b>${correctCatName}</b></div>`;
        } else {
          feedbackEl.innerHTML = "答錯了，加油！💪";
        }
        playSound(false);
      }

      setTimeout(() => {
        currentIndex++;
        if (currentIndex < 10) {
          showQuestion();
        } else {
          endGame();
        }
      }, 1500);
    }

    function endGame() {
      document.getElementById('final-score').innerText = score;
      const evalText = document.getElementById('eval-text');
      
      if (score === 10) {
        evalText.innerText = "滿分！你是優秀的「圖書分類小達人」！🌟";
      } else if (score >= 7) {
        evalText.innerText = "表現非常好！繼續保持課外閱讀的好習慣喔！👍";
      } else {
        evalText.innerText = "多去學校圖書館看看，下一次一定會拿高分！✨";
      }

      document.getElementById('result-modal').style.display = 'flex';
    }

    function restartGame() {
      initGame();
    }
  </script>
</body>
</html>
