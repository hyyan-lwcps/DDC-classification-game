<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>圖書分類大挑戰 - 小一自主學習</title>
  <style>
    /* 全局樣式與 RWD 設定 */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "Microsoft JhengHei", "微軟正黑體", Arial, sans-serif;
    }

    body {
      background-color: #f0f8ff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 15px;
    }

    .game-container {
      background-color: #ffffff;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.15);
      width: 100%;
      max-width: 600px;
      padding: 25px;
      text-align: center;
      position: relative;
      border: 4px solid #4a90e2;
    }

    /* 標題與資訊欄 */
    h1 {
      color: #2c3e50;
      font-size: 1.8rem;
      margin-bottom: 10px;
    }

    .status-bar {
      display: flex;
      justify-content: space-between;
      font-size: 1.2rem;
      font-weight: bold;
      color: #34495e;
      margin-bottom: 20px;
      background-color: #ebf5fb;
      padding: 10px 15px;
      border-radius: 12px;
    }

    /* 卡片區塊 */
    .book-card {
      background: #fff8dc;
      border: 3px dashed #f39c12;
      border-radius: 15px;
      padding: 30px 15px;
      margin-bottom: 25px;
      min-height: 160px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .book-title {
      font-size: 1.8rem;
      font-weight: bold;
      color: #d35400;
      margin-top: 10px;
      word-break: break-all;
    }

    /* 按鈕樣式 */
    .button-group {
      display: flex;
      gap: 15px;
      justify-content: center;
    }

    .btn {
      flex: 1;
      padding: 18px 10px;
      font-size: 1.3rem;
      font-weight: bold;
      border: none;
      border-radius: 15px;
      cursor: pointer;
      transition: transform 0.1s, background-color 0.2s;
      box-shadow: 0 5px 0 rgba(0,0,0,0.2);
    }

    .btn:active {
      transform: translateY(4px);
      box-shadow: 0 1px 0 rgba(0,0,0,0.2);
    }

    .btn-info {
      background-color: #2ecc71;
      color: white;
    }

    .btn-non-info {
      background-color: #3498db;
      color: white;
    }

    .btn-restart {
      background-color: #e67e22;
      color: white;
      margin-top: 20px;
      padding: 12px 30px;
      font-size: 1.2rem;
    }

    /* 反饋訊息 */
    .feedback {
      height: 30px;
      font-size: 1.3rem;
      font-weight: bold;
      margin-top: 15px;
    }
    .correct { color: #27ae60; }
    .wrong { color: #c0392b; }

    /* 結果彈窗 Modal */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0,0,0,0.6);
      justify-content: center;
      align-items: center;
      z-index: 100;
    }

    .modal-content {
      background-color: #ffffff;
      /* 設定背景圖片為相對路徑 happy.png，若為 jpg 可修改檔名 */
      background-image: url('happy.png'); 
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      border-radius: 20px;
      padding: 30px;
      width: 90%;
      max-width: 450px;
      text-align: center;
      box-shadow: 0 5px 15px rgba(0,0,0,0.3);
      border: 5px solid #f1c40f;
      position: relative;
    }

    /* 半透明遮罩，確保文字清楚 */
    .modal-overlay {
      background-color: rgba(255, 255, 255, 0.85);
      padding: 20px;
      border-radius: 15px;
    }

    .modal-title {
      font-size: 2rem;
      color: #2c3e50;
      margin-bottom: 10px;
    }

    .score-display {
      font-size: 1.8rem;
      color: #e74c3c;
      font-weight: bold;
      margin: 15px 0;
    }

    /* 手機平板極致適應 */
    @media (max-width: 480px) {
      .button-group {
        flex-direction: column;
      }
      .book-title {
        font-size: 1.5rem;
      }
      .btn {
        font-size: 1.1rem;
      }
    }
  </style>
</head>
<body>

  <div class="game-container">
    <h1>📚 圖書分類大挑戰</h1>
    
    <div class="status-bar">
      <span>第 <span id="current-question">1</span> / 10 題</span>
      <span>得分：<span id="score">0</span> 分</span>
    </div>

    <div class="book-card">
      <div>📖 請分類這本書：</div>
      <div class="book-title" id="book-title">載入中...</div>
    </div>

    <div class="button-group">
      <button class="btn btn-info" onclick="checkAnswer('knowledge')">💡 知識類圖書</button>
      <button class="btn btn-non-info" onclick="checkAnswer('non-knowledge')">🏰 故事類圖書</button>
    </div>

    <div class="feedback" id="feedback"></div>
  </div>

  <div class="modal" id="result-modal">
    <div class="modal-content">
      <div class="modal-overlay">
        <div class="modal-title">🎉 挑戰完成！</div>
        <div class="score-display">你一共得到 <span id="final-score">0</span> / 10 分！</div>
        <p id="eval-text" style="font-size: 1.1rem; font-weight: bold; color: #34495e;"></p>
        <button class="btn btn-restart" onclick="restartGame()">再玩一次 🔄</button>
      </div>
    </div>
  </div>

  <script>
    // 適合香港小一學生的題目庫 (知識類 vs 故事類)
    const questionBank = [
      { title: "《恐龍百科全書》", type: "knowledge" },
      { title: "《白雪公主》", type: "non-knowledge" },
      { title: "《神奇的植物世界》", type: "knowledge" },
      { title: "《三隻小豬》", type: "non-knowledge" },
      { title: "《香港野生動物圖鑑》", type: "knowledge" },
      { title: "《小紅帽》", type: "non-knowledge" },
      { title: "《宇宙與行星秘話》", type: "knowledge" },
      { title: "《伊索寓言故事》", type: "non-knowledge" },
      { title: "《認識我們的身體》", type: "knowledge" },
      { title: "《丑小鴨》", type: "non-knowledge" },
      { title: "《交通工具大集合》", type: "knowledge" },
      { title: "《睡美人》", type: "non-knowledge" },
      { title: "《海洋生物小知識》", type: "knowledge" },
      { title: "《灰姑娘》", type: "non-knowledge" },
      { title: "《天氣的變化》", type: "knowledge" }
    ];

    let currentQuestions = [];
    let currentIndex = 0;
    let score = 0;
    let canAnswer = true;

    // Web Audio API 音效產生器 (無須外部音效檔)
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playSound(isCorrect) {
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);

      if (isCorrect) {
        // 正確音效：高音雙響 (Ding-Dong)
        osc.type = 'sine';
        osc.frequency.setValueAtTime(523.25, audioCtx.currentTime); // C5
        osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.1); // E5
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
        osc.start(audioCtx.currentTime);
        osc.stop(audioCtx.currentTime + 0.3);
      } else {
        // 錯誤音效：低音嘟聲 (Buzz)
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(150, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
        osc.start(audioCtx.currentTime);
        osc.stop(audioCtx.currentTime + 0.3);
      }
    }

    // 初始化遊戲（隨機抽 10 題）
    function initGame() {
      // 隨機打亂題庫並取前10題
      let shuffled = [...questionBank].sort(() => 0.5 - Math.random());
      currentQuestions = shuffled.slice(0, 10);
      
      currentIndex = 0;
      score = 0;
      canAnswer = true;

      document.getElementById('score').innerText = score;
      document.getElementById('result-modal').style.display = 'none';
      document.getElementById('feedback').innerText = '';

      showQuestion();
    }

    // 顯示當前題目
    function showQuestion() {
      document.getElementById('current-question').innerText = currentIndex + 1;
      document.getElementById('book-title').innerText = currentQuestions[currentIndex].title;
      document.getElementById('feedback').innerText = '';
      canAnswer = true;
    }

    // 檢查答案
    function checkAnswer(selectedType) {
      if (!canAnswer) return;
      canAnswer = false;

      const currentQ = currentQuestions[currentIndex];
      const feedbackEl = document.getElementById('feedback');

      if (selectedType === currentQ.type) {
        score++;
        document.getElementById('score').innerText = score;
        feedbackEl.className = "feedback correct";
        feedbackEl.innerText = "答對了！太棒了！👏";
        playSound(true);
      } else {
        feedbackEl.className = "feedback wrong";
        feedbackEl.innerText = "答錯了，加油！💪";
        playSound(false);
      }

      // 1 秒後進入下一題或結算
      setTimeout(() => {
        currentIndex++;
        if (currentIndex < 10) {
          showQuestion();
        } else {
          endGame();
        }
      }, 1000);
    }

    // 每局結束處理
    function endGame() {
      document.getElementById('final-score').innerText = score;
      const evalText = document.getElementById('eval-text');
      
      if (score === 10) {
        evalText.innerText = "太厲害了！你是圖書分類小達人！🌟";
      } else if (score >= 7) {
        evalText.innerText = "表現很好！繼續保持！很棒喔！👍";
      } else {
        evalText.innerText = "再試一次，你一定可以做得更好！✨";
      }

      // 顯示彈窗視窗
      document.getElementById('result-modal').style.display = 'flex';
    }

    // 重啟遊戲
    function restartGame() {
      initGame();
    }

    // 頁面載入後自動開啟遊戲
    window.onload = initGame;
  </script>
</body>
</html>
